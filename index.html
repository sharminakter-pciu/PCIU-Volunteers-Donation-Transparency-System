<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCIU Volunteers Donation</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1, h2 {
      text-align: center;
      margin: 8px 0;
    }

    h2 {
      color: #555;
    }

    .total {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      color: green;
      margin: 20px 0;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
    }

    th {
      background: #087c35;
      color: white;
      padding: 12px;
    }

    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    tr:hover {
      background: #f2f2f2;
    }

    .message {
      text-align: center;
      padding: 15px;
      color: #666;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
      }

      th, td {
        padding: 8px;
        font-size: 13px;
      }

      .total {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>PCIU Volunteers</h1>
    <h2>Donation Transparency</h2>

    <div class="total">
      Total Collected: ৳ <span id="total">0</span>
    </div>

    <input type="text" id="search" placeholder="Search number, method or reference...">

    <table>
      <thead>
        <tr>
          <th>Number</th>
          <th>Amount</th>
          <th>Method</th>
          <th>Reference</th>
        </tr>
      </thead>
      <tbody id="table">
        <tr>
          <td colspan="4" class="message">Loading data...</td>
        </tr>
      </tbody>
    </table>

    <div class="footer">
      সকল ডোনেশনের হিসাব স্বচ্ছভাবে প্রকাশ করা হচ্ছে।
    </div>
  </div>

  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSgQ4esg6HfqhEC4deNG68Vmvfa2W9ymSmg4E7EClSt4P39YdqTQ3qeMERtRh09rrN3UPdqFWrfuymC/pub?output=csv";

    const table = document.getElementById("table");
    const totalEl = document.getElementById("total");
    const searchInput = document.getElementById("search");

    let donationData = [];

    function cleanText(text) {
      return text ? text.replace(/"/g, "").trim() : "";
    }

    function parseCSV(csvText) {
      const rows = csvText.trim().split(/\r?\n/).slice(1);

      return rows.map(row => {
        const columns = row.split(",");

        return {
          number: cleanText(columns[0]),
          amount: cleanText(columns[1]),
          method: cleanText(columns[2]),
          reference: cleanText(columns[3])
        };
      }).filter(item => item.number && item.amount);
    }

    function showData(data) {
      table.innerHTML = "";

      if (data.length === 0) {
        table.innerHTML = `
          <tr>
            <td colspan="4" class="message">No donation data found</td>
          </tr>
        `;
        totalEl.innerText = "0";
        return;
      }

      let total = 0;

      data.forEach(item => {
        const amountNumber = Number(item.amount) || 0;
        total += amountNumber;

        table.innerHTML += `
          <tr>
            <td>${item.number}</td>
            <td>৳ ${item.amount}</td>
            <td>${item.method}</td>
            <td>${item.reference || "-"}</td>
          </tr>
        `;
      });

      totalEl.innerText = total;
    }

    function searchData() {
      const value = searchInput.value.toLowerCase();

      const filteredData = donationData.filter(item =>
        item.number.toLowerCase().includes(value) ||
        item.method.toLowerCase().includes(value) ||
        item.reference.toLowerCase().includes(value)
      );

      showData(filteredData);
    }

    fetch(sheetURL)
      .then(response => {
        if (!response.ok) {
          throw new Error("Sheet data loading failed");
        }
        return response.text();
      })
      .then(csvText => {
        donationData = parseCSV(csvText);
        showData(donationData);
      })
      .catch(error => {
        table.innerHTML = `
          <tr>
            <td colspan="4" class="message">
              Data load হয়নি। Live Server দিয়ে open করো এবং CSV link check করো।
            </td>
          </tr>
        `;
        console.error(error);
      });

    searchInput.addEventListener("input", searchData);
  </script>

</body>
</html>
